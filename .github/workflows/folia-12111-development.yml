name: Folia 1.21.11 Development CI
on:
  push:
    branches: ['folia/1.21.11']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: folia-dev-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and run tests (experimental, no deployment)
        run: ./gradlew --no-daemon --max-workers=2 --console=plain '-Dorg.gradle.jvmargs=-Xmx2400m -XX:MaxMetaspaceSize=768m' build
      - name: Development build artifacts — not a public release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: folia-1.21.11-${{ github.run_number }}
          path: |
            **/build/libs/*.jar
            !**/*-sources.jar
            !**/*-javadoc.jar
          if-no-files-found: warn
          retention-days: 7
